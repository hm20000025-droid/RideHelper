name: Inspect RideHelper ZIP

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect ZIP contents
        run: |
          echo "Files in repository:"
          ls -la

          echo "ZIP contents:"
          unzip -l RideHelper-phone-build.zip

          echo "Java package declarations:"
          unzip -p RideHelper-phone-build.zip MainActivity.java \
            | grep -nE '^(package |import )' | head -30 || true

          unzip -p RideHelper-phone-build.zip ScreenScanService.java \
            | grep -nE '^(package |import )' | head -30 || true

          echo "Manifest:"
          unzip -p RideHelper-phone-build.zip AndroidManifest.xml \
            | head -60
            
